# ntfy-idp-push example config. Every key can also be set as NTFY_IDP_PUSH_<KEY>
# (dashes to underscores; lists comma-separated). SIGHUP reloads per-request settings.
# Secrets (duo-secret-key, duo-secret-key-previous, ntfy-admin-token, directory-ldap-password,
# smtp-password) can instead be read from a file: <key>-file here, or NTFY_IDP_PUSH_<KEY>_FILE.
# The directory-*, smtp-* and mail-* keys take effect only on a restart; a SIGHUP that changes one
# is refused.

# Plain HTTP. The reverse proxy in front terminates TLS for duo-hostname, preserves Host, and signs
# users in (forward-auth). Only the proxy may reach this port.
listen-http: ":8080"
# public-url: "https://push.example.com"  # default: https://<duo-hostname>

duo-hostname: "push.example.com"        # Authelia duo_api.hostname; also the WebAuthn RP ID
duo-integration-key: "DI…"              # ntfy-idp-push keygen
duo-secret-key: "…"
# duo-secret-key-file: "/run/secrets/duo_secret_key"
duo-max-skew: "300s"
push-timeout: "60s"
push-disabled: false                    # kill switch: every preauth/auth answers deny
duo-key-grace: "1h"                     # previous key accepted this long after keygen --rotate

# The enrollment, provisioning and device pages take the signed-in username from identity-header,
# which the proxy sets after its forward-auth step. The header is believed only from trusted-proxies,
# so keep that list to the proxy itself: anyone who can reach the port from a trusted address can
# sign in as anyone.
trusted-proxies: ["10.0.0.5/32"]   # the proxy's address alone, not its subnet
identity-header: "Remote-User"         # authentik: X-authentik-username; oauth2-proxy: X-Auth-Request-User
enroll-portal-url: "https://push.example.com/enroll"   # empty: unenrolled users are denied

ntfy-base-url: "https://ntfy.example.com"
ntfy-admin-token: "tk_…"
# ntfy-admin-token-file: "/run/secrets/ntfy_admin_token"
ntfy-topic-prefix: "push-"
default-topics: ["alerts", "${user}-inbox"]

enroll-role: "user"
enroll-access:
  - "${user}-*:rw"
  - "alerts:ro"
enroll-access-reconcile: false

webauthn-allow-synced: false
# Default true: a passkey without an attestation statement could come from any software
# authenticator, and "device-bound" would be only a promise the client makes.
webauthn-require-attestation: true
database: "/var/lib/ntfy-idp-push/db.sqlite"

# The user directory controls who has an ntfy account. Every directory-sync-interval (and once at
# startup), the shim lists the directory. New people get an account and a welcome email with their
# ntfy password. People it listed before and no longer lists, or marks disabled, are deleted, with
# their devices and ntfy account. A directory that errors skips the round.
directory-type: "ldap"                  # ldap | file; required
directory-sync-interval: "15m"

# directory-type: file reads Authelia's file user database (users_database.yml), re-read every round.
# directory-file: "/etc/authelia/users_database.yml"
# directory-group: ""                   # only users in this group, which must have one; empty: everyone

# directory-type: ldap. Use the same server and bind user as Authelia's ldap backend.
directory-ldap-address: "ldaps://ldap.example.com:636"   # ldaps:// or ldap://
directory-ldap-start-tls: false         # ldap:// only: upgrade with StartTLS before binding
directory-ldap-tls-skip-verify: false
directory-ldap-ca-file: ""              # PEM bundle trusted besides the system roots (private CA)
directory-ldap-base-dn: "dc=example,dc=com"
directory-ldap-user: "cn=authelia,dc=example,dc=com"     # bind DN; empty binds anonymously
directory-ldap-password: "…"
# directory-ldap-password-file: "/run/secrets/ldap_password"
directory-ldap-users-filter: "(objectClass=person)"      # lists every user; no {input} placeholder
directory-ldap-attribute-username: "uid"
directory-ldap-attribute-mail: "mail"
directory-ldap-attribute-display-name: "displayName"
directory-ldap-attribute-member-of: "memberOf"
directory-ldap-group-dn: ""             # only members of this group DN, which must exist; empty: everyone the filter finds

# The SMTP relay for the welcome email, which carries the user's ntfy password. Port 465 is
# implicit TLS; on any other port smtp-starttls refuses a relay that does not upgrade.
smtp-host: "smtp.example.com"           # required
smtp-port: 587
smtp-user: "…"
smtp-password: "…"
# smtp-password-file: "/run/secrets/smtp_password"
smtp-starttls: true
mail-from: "ntfy-idp-push <push@example.com>"   # required
mail-reply-to: ""                       # e.g. the admins who can resend a welcome
