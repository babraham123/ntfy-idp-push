# docker compose -f deploy/compose.yaml up -d
# ./config holds server.yml (from deploy/server.yml). It is mounted as a directory, not file by file,
# so replacing a file (keygen --rotate) is seen inside the container.
#
# The shim speaks plain HTTP and trusts the identity header from trusted-proxies, so it must only be
# reachable through the reverse proxy that terminates TLS for duo-hostname and runs Authelia's or
# authentik's forward-auth. Put the proxy on the `proxy` network and point it at ntfy-idp-push:8080;
# never publish the port on the host.
services:
  ntfy-idp-push:
    image: ghcr.io/babraham123/ntfy-idp-push:latest
    restart: unless-stopped
    networks: [proxy]
    # The binary is static and writes only to the state volume, so the rest of the container can be
    # locked down without losing anything.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: nonroot
    pids_limit: 64
    mem_limit: 256m
    volumes:
      - ./config:/etc/ntfy-idp-push:ro
      - state:/var/lib/ntfy-idp-push
      # directory-type: file reads Authelia's user database. Mount its directory rather than the file:
      # a file bind mount shows the original file after the host replaces it.
      # - ../authelia/users:/etc/authelia:ro
    # A secret is named three times: the top-level secrets: says where Compose reads it on the host, the
    # service's secrets: mounts it at /run/secrets/<name>, and the _FILE variable tells the app that path.
    # Reading secrets from files keeps them out of server.yml and the environment.
    environment:
      NTFY_IDP_PUSH_DUO_SECRET_KEY_FILE: /run/secrets/duo_secret_key
      NTFY_IDP_PUSH_NTFY_ADMIN_TOKEN_FILE: /run/secrets/ntfy_admin_token
      NTFY_IDP_PUSH_DIRECTORY_LDAP_PASSWORD_FILE: /run/secrets/ldap_password
      NTFY_IDP_PUSH_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - duo_secret_key
      - ntfy_admin_token
      - ldap_password      # only for directory-type: ldap
      - smtp_password
    healthcheck:
      test: ["CMD", "/usr/bin/ntfy-idp-push", "healthcheck"]
      interval: 30s
      timeout: 5s

secrets:
  duo_secret_key:
    file: ./secrets/duo_secret_key
  ntfy_admin_token:
    file: ./secrets/ntfy_admin_token
  ldap_password:
    file: ./secrets/ldap_password
  smtp_password:
    file: ./secrets/smtp_password

networks:
  proxy:
    external: true   # the reverse proxy's network; the proxy's own address on it goes in trusted-proxies

volumes:
  state:
