version: 2

builds:
  - main: ./cmd/ntfy-idp-push
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # .Tag keeps the v prefix, matching the image build and the module version go install records.
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, ARCHITECTURE.md, deploy/server.yml, deploy/compose.yaml]

checksum:
  name_template: checksums.txt

release:
  # v1.2.3-rc.1 is marked as a pre-release, so it never becomes the repo's "Latest release".
  prerelease: auto

changelog:
  # GitHub's generated notes: the merged PRs since the previous tag.
  use: github-native
