version: 2

builds:
  - main: ./cmd/ntfy-idp-push
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, ARCHITECTURE.md, deploy/server.yml, deploy/compose.yaml]

checksum:
  name_template: checksums.txt

changelog:
  use: github
